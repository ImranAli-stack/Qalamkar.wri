<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | Qalamkar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="frontpage.html" class="brand"><span class="brand-mark">Q</span><span>Qalamkar</span></a>
        <nav class="nav-links">
          <a href="frontpage.html">Home</a>
          <a href="about.html">About</a>
          <a href="competitions.html">Competitions</a>
          <a href="contact.html">Contact</a>
          <a href="monetization.html">Monetize</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="btn-ghost">Login</a>
          <a href="signup.html" class="btn">Create account</a>
        </div>
      </div>
    </header>

    <main class="form-shell">
      <div class="auth-panel">
        <h2>Choose a new password</h2>
        <p>Enter a new password for your Qalamkar account.</p>
        <form data-auth-form="reset-password">
          <div class="form-group">
            <label for="reset-password">New password</label>
            <input id="reset-password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
          </div>
          <p role="status" aria-live="polite" data-auth-status></p>
          <button class="btn" type="submit" style="width: 100%;">Update password</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-shell">
        <div><strong>Qalamkar</strong><div>Value your words</div></div>
        <div class="footer-links">
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="frontpage.html">Home</a>
        </div>
        <div>© <span data-year></span> Qalamkar</div>
      </div>
    </footer>

    <script type="module" src="script.js"></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
